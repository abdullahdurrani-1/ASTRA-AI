name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app devtools
      - name: pytest (failures surfaced as annotations)
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.out | cut -c1-900 | sed 's/^/::error::/' || true
          exit $status
      - name: Intent routing gate (golden set)
        run: python -m evaluation.run_intent_eval
      - name: End-to-end smoke run with mock providers (not a quality gate)
        run: python -m evaluation.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
